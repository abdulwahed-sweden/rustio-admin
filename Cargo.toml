[workspace]
resolver = "2"
members = [
    "crates/rustio-admin",
    "crates/rustio-admin-macros",
    "crates/rustio-admin-cli",
    "crates/rio-theme",
]
# The example projects are each their OWN standalone workspace (own
# Cargo.lock), so they're excluded from the framework workspace:
#   examples/clinic — canonical multi-crate reference; pins the
#                     published rustio-admin (CI patches it to HEAD).
#   examples/shop   — single-crate e-commerce admin; path-deps the
#                     in-repo framework directly (always builds HEAD).
exclude = ["examples/clinic", "examples/shop"]

[workspace.package]
version = "0.30.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/abdulwahed-sweden/rustio-admin"
homepage = "https://github.com/abdulwahed-sweden/rustio-admin"
authors = ["Abdulwahed Mansour"]

[workspace.dependencies]
rustio-admin = { version = "0.30.0", path = "crates/rustio-admin" }
rustio-admin-macros = { version = "0.30.0", path = "crates/rustio-admin-macros" }
