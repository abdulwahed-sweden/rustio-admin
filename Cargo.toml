[workspace]
resolver = "2"
members = [
    "crates/rustio-admin",
    "crates/rustio-admin-macros",
    "crates/rustio-admin-cli",
    "crates/rio-theme",
    "examples/clinic",
]
# `examples/clinic-admin` is the canonical multi-crate reference project.
# It is its OWN standalone workspace (depends on the published
# rustio-admin), so it is excluded from this framework workspace.
exclude = ["examples/clinic-admin"]

[workspace.package]
version = "0.27.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/abdulwahed-sweden/rustio-admin"
homepage = "https://github.com/abdulwahed-sweden/rustio-admin"
authors = ["Abdulwahed Mansour"]

[workspace.dependencies]
rustio-admin = { version = "0.27.5", path = "crates/rustio-admin" }
rustio-admin-macros = { version = "0.27.5", path = "crates/rustio-admin-macros" }
