{% extends "admin/_base.html" %}
{% block content %}
<div class="rio-auth-card">
  <h1 class="rio-auth-title">{{ site_header }}</h1>
  {% if error %}<div class="rio-alert rio-alert--danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" class="rio-form" autocomplete="on">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    {% for section in sections %}
      {% for field in section.fields %}{% include "admin/includes/_form_field.html" %}{% endfor %}
    {% endfor %}
    <button type="submit" class="rio-btn rio-btn--primary rio-btn--md">Sign in</button>
  </form>
  <p class="rio-auth-card-foot"><a href="/admin/forgot-password">Forgot your password?</a></p>
</div>
{% endblock %}
