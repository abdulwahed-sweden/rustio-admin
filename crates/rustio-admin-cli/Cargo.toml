[package]
name = "rustio-admin-cli"
# Realigned with the workspace at 0.3.0 (was at 0.2.1 from the
# scaffold-template patch). Bundled template now pins new projects
# to `rustio-admin = "0.3"`.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Command-line tools for rustio-admin: project scaffolding, migrations, user management."
readme = "../../README.md"

[[bin]]
name = "rustio"
path = "src/main.rs"

[dependencies]
rustio-admin = { workspace = true }

# CLI surface
clap      = { version = "4", features = ["derive"] }
rpassword = "7"

# DB + env (DATABASE_URL is read from .env when present)
sqlx      = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
chrono    = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy   = "0.15"
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
env_logger = "0.11"
log       = "0.4"
