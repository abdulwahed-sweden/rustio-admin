[package]
name = "rustio-admin-cli"
# Tracks the workspace minor. Bundled template pins new projects to
# `rustio-admin = "0.31.0"`. CI guards this in `.github/workflows/ci.yml`.
version = "0.31.0"
edition.workspace = true
# Deliberately NOT `rust-version.workspace = true`. The workspace floor
# (1.94) is driven by `sqlx 0.9`, which the default (lightweight) build
# does not compile. The light dependency set's real floor is 1.85 — set by
# mainstream crates (`clap 4.6`, `toml_edit 0.25`, `sha2`/`digest`/`rand`),
# not by anything we could shed. The `db` feature pulls `rustio-admin` (1.94)
# back in, so `cargo install --features db` correctly requires 1.94 again.
# A CI job (`msrv-cli-light` in ci.yml) pins this so it can't silently drift.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Command-line tools for rustio-admin: project scaffolding, migrations, user management."
readme = "../../README.md"

[[bin]]
name = "rustio-admin"
path = "src/main.rs"

[features]
# Lightweight by default. `cargo install rustio-admin-cli` builds only the
# scaffolding / theme / builder half — no `sqlx`, no runtime stack — so it
# installs on common toolchains without being dragged to the runtime's
# Rust 1.94 floor (see the install-friction plan).
default = []
# Database & authority verbs: `migrate`, `user`, `group`, `perm`, `audit`,
# `doctor`, `ai`, `memory`. These open a Postgres connection (and, for
# `doctor email`, an SMTP handshake), so they pull the full runtime stack —
# `rustio-admin` + `sqlx 0.9`, which is what raises the MSRV to 1.94.
# Install with `cargo install rustio-admin-cli --features db` on a project
# that already targets 1.94.
db = ["dep:rustio-admin", "dep:sqlx", "dep:tokio", "dep:lettre", "dep:rpassword"]

[dependencies]
# Runtime library — only linked by the `db` verbs. Optional so the default
# (lightweight) build never compiles it or its `sqlx`/`hyper`/`tokio` tree.
rustio-admin = { workspace = true, optional = true }
# Embedded admin templates (std-only leaf crate). The `override` verb
# reads template bytes from here rather than from the runtime, so it
# does not need the heavy runtime stack. Kept separate from the
# `rustio-admin` dep on purpose — the Stage 2 feature split gates the
# runtime behind `db` while this stays in the always-on light half.
rustio-admin-assets = { workspace = true }
# Theme engine (DESIGN_THEME). Build-time only — the `rustio-admin theme
# generate` subcommand turns raw brand colors into a static tokens.css.
# Runtime CSS is the generated file; the library does not depend on
# this crate.
rio-theme = { path = "../rio-theme", version = "0.31.0" }

# CLI surface
clap      = { version = "4", features = ["derive"] }
# Password prompt for `user create` — a `db` verb only. Optional so the
# lightweight build skips it.
rpassword = { version = "7", optional = true }
# Spinner + status feedback for long-running onboarding operations
# (PR 1.4 / DESIGN_ONBOARDING.md §9). The library's own TTY / non-TTY
# / NO_COLOR detection short-circuits to a no-op draw target in
# pipes / CI; we layer one additional gate on top so the global
# `--quiet` / `--no-progress` flags work too.
indicatif = "0.18"
# Terminal styling for `rustio-admin startapp` spatial-orientation output
# (paths, commands, URLs visually distinct). `console` is already in
# the transitive tree via `indicatif`; declaring it directly keeps
# the call site reviewable and locks the version. NO_COLOR / TTY
# detection lives inside the crate.
console = "0.16"

# DB + env (DATABASE_URL is read from .env when present). `sqlx`/`tokio`
# are `db`-only and optional — they are the crates that raise the MSRV to
# 1.94, so the lightweight build must not compile them. `chrono` stays
# always-on: the Builder (`builder/cmd.rs`, `history.rs`) uses it for
# `.rustio/history.jsonl` timestamps, and it carries a low MSRV.
sqlx      = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono"], optional = true }
chrono    = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy   = "0.15"
tokio     = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
env_logger = "0.11"
log       = "0.4"
# R4 emergency-recovery audit metadata. The CLI assembles a
# `serde_json::Value` per command (`cli_operation`, `reason`,
# `os_actor`, `cli_invocation`, plus per-op fields) and hands it
# to the framework's `audit::record`. The crate is already in the
# transitive tree via rustio-admin; declaring it as a direct dep
# keeps the call site reviewable.
serde_json = "1"
# `rustio-admin doctor email` opens a SMTP handshake against the
# configured server (and optionally sends a single test
# message). Matches the `lettre` feature set the
# clinic-appointments example ships with.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"], optional = true }

# Builder layer (DESIGN_BUILDER.md). These deps power the
# deterministic project compiler: canonical TOML emission, append-
# only event log, SchemaHash computation, and the redactor that
# prevents secrets from landing in `.rustio/history.jsonl`. The
# Builder is build-time only — none of these crates is reachable
# from runtime code in `rustio-admin`.
ulid = "1"
toml_edit = "0.25"
sha2 = "0.10"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
