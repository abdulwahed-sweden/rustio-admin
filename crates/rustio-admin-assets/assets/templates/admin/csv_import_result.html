{% extends "admin/_base.html" %}
{# The CSV import result.

   This page carried its own design system — a page-local <style> block
   with an `.imp-*` prefix and hard-coded colours, which drifted from
   the framework every time the framework moved. It is gone: the page is
   a facts line, an alert, the fix steps as bands of a card, and the row
   detail as an ops table. Nothing about what is generated changed. #}
{% block page_measure %}rio-page--standard{% endblock %}
{% block content %}
<nav class="rio-crumbs">
  <a href="/admin">Home</a><span class="rio-crumb-sep">·</span>
  <a href="/admin/{{ admin_name }}">{{ display_name }}</a><span class="rio-crumb-sep">·</span>
  <span class="rio-crumb-current">CSV import</span>
</nav>
<div class="rio-masthead-top">
  <div><h1>{{ page_title }}</h1></div>
  <div class="rio-masthead-cta">
    <a class="rio-btn rio-btn--secondary rio-btn--md" href="/admin/{{ admin_name }}">Back to {{ display_name }}</a>
  </div>
</div>

<p class="rio-dash-facts">
  <span><strong>{{ inserted }}</strong> inserted of <strong>{{ total }}</strong> row{% if total != 1 %}s{% endif %}</span>
  <span><strong>{{ failed }}</strong> failed</span>
  {% if ignored_columns %}<span><strong>{{ ignored_columns|length }}</strong> column{% if ignored_columns|length != 1 %}s{% endif %} skipped</span>{% endif %}
</p>

{% if ignored_columns %}
<div class="rio-alert rio-alert--warn" role="status">
  <strong>{{ ignored_columns|length }} column{% if ignored_columns|length != 1 %}s aren't{% else %} isn't{% endif %} on the {{ display_name }} model — skipped.</strong>
  <p>Their values were not saved. Add the fields and re-run the import to keep them.</p>
  <p class="rio-imp-cols">{% for c in ignored_columns %}<code>{{ c }}</code>{% endfor %}</p>
</div>

<div class="rio-form-card rio-imp-fix">
  <fieldset class="rio-fieldset">
    <legend class="rio-fieldset-legend">1 · Migration</legend>
    <pre class="rio-code"><code>{{ migration_sql }}</code></pre>
    <p class="rio-imp-note">Save as <code>migrations/&lt;next-number&gt;_add_{{ table }}_fields.sql</code>, then run <code>rustio-admin migrate apply</code>. Types are guessed from the column names — adjust before committing.</p>
  </fieldset>
  <fieldset class="rio-fieldset">
    <legend class="rio-fieldset-legend">2 · Model struct (src/{{ admin_name }}.rs)</legend>
    <pre class="rio-code"><code>{% for f in suggested_fields %}{{ f.rust_field }}
{% endfor %}</code></pre>
  </fieldset>
  <fieldset class="rio-fieldset">
    <legend class="rio-fieldset-legend">3 · Wire the field into the Model impl</legend>
    <pre class="rio-code"><code>// add to COLUMNS and INSERT_COLUMNS: {% for f in suggested_fields %}"{{ f.column }}"{% if not loop.last %}, {% endif %}{% endfor %}

{% for f in suggested_fields %}{{ f.from_row }}
{% endfor %}
{% for f in suggested_fields %}{{ f.insert_value }}
{% endfor %}</code></pre>
    <p class="rio-imp-note">Re-run the import afterwards and these columns will be saved.</p>
  </fieldset>
</div>
{% endif %}

<div class="rio-board rio-imp-rows">
  <div class="rio-board-title"><h2>Row detail</h2><span class="rio-meta">{{ outcomes|length }}</span></div>
  {% if outcomes %}
  <div class="rio-tablewrap">
    <table class="rio-dtable rio-dtable--ops">
      <thead><tr><th>Row</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody>
        {% for o in outcomes %}
        <tr>
          <td class="rio-cell-fit"><span class="rio-cell-primary">{{ o.row_number }}</span></td>
          <td>{% if o.status == "inserted" %}<span class="rio-mark">inserted</span>{% else %}<span class="rio-pill rio-pill--danger">failed</span>{% endif %}</td>
          <td>
            {% if o.id %}<a class="rio-action-link" href="/admin/{{ admin_name }}/{{ o.id }}/edit">#{{ o.id }}</a>
            {% else %}<ul class="rio-imp-errs">{% for err in o.errors %}<li>{{ err }}</li>{% endfor %}</ul>{% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="rio-empty">
    <div class="rio-empty-title">CSV had no data rows</div>
    <div>The file parsed but contained only a header (or was empty). Add at least one data row and try again.</div>
  </div>
  {% endif %}
</div>
{% endblock %}
