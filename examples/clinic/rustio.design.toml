# ════════════════════════════════════════════════════════════════════
#  clinic — rustio.design.toml
#
#  The clinic's design memory (WHY/WHAT via [design]) + the Tier-1 visual
#  slice approved in DESIGN_REASONING R-05 / D-05. Everything here fits the
#  safe design seam: tokens + validated custom_css (served via
#  RUSTIO_TOKENS_CSS) and the [navigation] layer (served via
#  RUSTIO_TEMPLATE_DIR). NO new model semantics; no provider/calendar/
#  reporting/portal/aggregate profile/picker/relation-FK (out of scope).
#
#  Run `rustio-design context` to read the whole stack before changing this.
# ════════════════════════════════════════════════════════════════════

[project]
name = "Clinic"
out_dir = "generated"
rustio_admin_path = "../.."

# ── Design memory (WHY / WHAT) — reason from these before any design. ──
[design]
brief        = "design/DESIGN_BRIEF.md"
reasoning    = "design/DESIGN_REASONING.md"
architecture = "design/DESIGN_ARCHITECTURE.md"
decisions    = "design/DESIGN_DECISIONS.md"
history      = "design/DESIGN_HISTORY.md"

# ── Emerald/slate palette (Tier 1: migrated verbatim from the former
#    static/tokens.css — same values, now stack-governed + drift-checked). ──
[colors]
accent       = "#059669"   # emerald-600 — clinic brand (fills, primary buttons)
accent-hover = "#047857"   # emerald-700 — hover / text-contrast pairing
bg           = "#f8fafc"   # slate-50 page canvas
surface      = "#ffffff"   # cards, topbar, table body
text         = "#0f172a"   # slate-900
text-muted   = "#475569"   # slate-600
border       = "#e2e8f0"   # slate-200

# ── Navigation grouping: DEFERRED (2026-06-29). The framework migrated its
#    sidebar to the dark `.rio-rail` command rail, which already auto-builds
#    grouped nav (Models / Access / Developer) from the model registry. The
#    previously generated `templates/admin/_sidebar.html` emitted pre-rail
#    `.rio-sidebar` markup that no longer matches any CSS, so it was dropped
#    and the clinic now uses the framework's embedded rail. Custom group
#    labels (Patients/Scheduling/Billing) and hiding Vitals need a rail-aware
#    generator + framework support — re-add the [navigation] block (with
#    `_out`) once that lands. See design/DESIGN_HISTORY.md (2026-06-29).

# ── Safe visual seam (Tier 1). custom_css is validated (no @import / remote
#    url / markup). Status pills, USD money formatting, and per-column PII
#    de-emphasis are intentionally NOT here — they need template/model hooks
#    (see DESIGN_REASONING R-05 "requires later support"). ──
[custom_css]
rules = """
/* Tier 1 (D-05) — refinements that fit the existing markup only. */

/* Search-first: the patient list search is the primary navigation (OBS-02). */
.rio-search-bar   { max-width: 640px; }
.rio-search-input { font-size: var(--rio-fs-lg, 1.125rem); padding-block: 0.6rem; }

/* Status colour-coding (cell-level). The framework mirrors a text cell's
   value into its title attribute, so we can colour the known status values
   without a template. True pills need a wrapping element (deferred). */
td.rio-td--text[title="scheduled"] { color: var(--rio-accent);     font-weight: 600; }
td.rio-td--text[title="completed"],
td.rio-td--text[title="paid"]      { color: var(--rio-success);    font-weight: 600; }
td.rio-td--text[title="unpaid"]    { color: var(--rio-warning);    font-weight: 600; }
td.rio-td--text[title="cancelled"] { color: var(--rio-text-muted); }
"""
