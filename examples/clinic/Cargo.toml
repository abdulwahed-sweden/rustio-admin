[package]
name = "clinic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Standalone data-layer crate for the clinic schema in
# `migrations/0001_clinic_schema.sql`.
#
# NOT wired to rustio-admin: the schema uses UUID primary keys,
# which the rustio-admin admin runtime does not support today
# (every URL / ORM call assumes `i64`). Treat this crate as the
# typed data layer you can later wrap in any HTTP framework
# (axum / actix / a future UUID-aware admin layer).

[lib]
path = "src/lib.rs"

[dependencies]
chrono       = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde        = { version = "1", features = ["derive"] }
sqlx         = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "macros",
] }
thiserror    = "1"
uuid         = { version = "1", features = ["v4", "serde"] }
