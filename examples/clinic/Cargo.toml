# The canonical RustIO Admin project workspace.
#
# This is the shape `rustio startproject` produces and the structure
# every RustIO project keeps for its whole life: one workspace, one
# foundation crate (`clinic-core`), one crate per business capability
# (`patients`, `scheduling`, `billing`), and one server crate
# (`clinic-server`) that boots everything. See docs/ARCHITECTURE.md.
#
# It is a standalone workspace (its own Cargo.lock) and depends on the
# published framework, exactly like a real project would.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
rustio-admin = "0.28.0"
chrono       = { version = "0.4", features = ["serde"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy      = "0.15"
env_logger   = "0.11"
log          = "0.4"

# Internal crates, wired by path. Capabilities depend ONLY on
# clinic-core — never on each other.
clinic-core = { path = "crates/clinic-core" }
patients    = { path = "crates/patients" }
scheduling  = { path = "crates/scheduling" }
billing     = { path = "crates/billing" }
