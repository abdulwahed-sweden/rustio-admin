[package]
name = "clinic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Standalone data-layer crate for the clinic schema in
# `migrations/0001_clinic_schema.sql`.
#
# NOT wired to rustio-admin: the schema uses UUID primary keys,
# which the rustio-admin admin runtime does not support today
# (every URL / ORM call assumes `i64`). Treat this crate as the
# typed data layer you can later wrap in any HTTP framework
# (axum / actix / a future UUID-aware admin layer).

[lib]
path = "src/lib.rs"

# HTTP server — `cargo run -p clinic` boots an axum web app that
# renders four HTML pages (dashboard, appointments, patients,
# worklist) and four JSON endpoints. Inline CSS, no template
# engine, no JS — minimum-dep production-shape demo. See src/main.rs.
[[bin]]
name = "clinic"
path = "src/main.rs"

[dependencies]
axum         = "0.7"
chrono       = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy      = "0.15"
rust_decimal = { version = "1", features = ["serde"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sqlx         = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "macros",
] }
thiserror    = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid         = { version = "1", features = ["v4", "serde"] }
