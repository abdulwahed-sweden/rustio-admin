# FixShop is a standalone example, not a workspace member. The empty
# `[workspace]` table below makes this directory its own workspace root
# so `cargo build --workspace` at the repository root is unaffected —
# `rustio-admin` ships no bundled examples in its published crate, and
# CI's lint/test gate stays scoped to `crates/`.
[workspace]

[package]
name = "fixshop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Path dependency so the example always compiles against the framework
# in this checkout. A real project writes `rustio-admin = "0.33"`.
#
# Model files depend on `rustio-admin` ALONE: field types (`Decimal`,
# `NaiveDate`, …) and everything the `RustioAdmin` derive generates
# resolve through the framework's re-exports, so `chrono` / `sqlx` /
# `rust_decimal` are deliberately absent here.
rustio-admin = { path = "../../crates/rustio-admin" }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy      = "0.15"
env_logger   = "0.11"
log          = "0.4"
