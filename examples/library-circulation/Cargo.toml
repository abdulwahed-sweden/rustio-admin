[package]
name = "library-circulation"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "library-circulation"
path = "src/main.rs"

[dependencies]
rustio-admin.workspace = true
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Bulk actions on Loan run raw SQL through the framework's Db pool
# (`db.pool()` returns a sqlx::PgPool). Matches the version + feature
# set the rustio-admin-cli scaffold template ships.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
