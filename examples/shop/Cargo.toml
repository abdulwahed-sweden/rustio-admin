[package]
name = "shop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# This example path-deps the in-repo framework, so it always builds against
# the current source (HEAD) — the complement to examples/clinic, which pins
# the published crate. A real downstream project would instead write
# `rustio-admin = "0.27"`.
# Model files depend on `rustio-admin` ALONE — field types (`Decimal`,
# `DateTime`, `Uuid`, …) and the derive macro's generated code resolve
# through the framework's re-exports, so `chrono` / `uuid` /
# `rust_decimal` / `sqlx` are no longer declared here. What remains is
# this binary's own runtime: the async runtime, .env loading, and logs.
rustio-admin = { path = "../../crates/rustio-admin" }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy      = "0.15"
env_logger   = "0.11"
log          = "0.4"

# Standalone workspace (own Cargo.lock); excluded from the framework
# workspace in the repo-root Cargo.toml, exactly like examples/clinic.
[workspace]
