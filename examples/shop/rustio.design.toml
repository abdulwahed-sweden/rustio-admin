# ════════════════════════════════════════════════════════════════════
#  shop — rustio.design.toml
#
#  Visual identity: the official RustIO Patina design system (R-010 / D-010),
#  a Claude Design handoff bundle whose admin kit is "Shop admin · Products".
#  One accent only — Patina #0E6B5B (teal-green verdigris) — on warm-stone
#  neutrals, light warm-paper chrome, radius 6/9/12, Hanken/JetBrains type.
#  Supersedes the navy+amber identity (D-001/002/003/005).
#
#  HOW layer of the design stack; WHY/WHAT live in design/DESIGN_*.md
#  (read `rustio-design context`). Reason in DESIGN_REASONING.md first.
#  Edit, then `rustio-design build`. Light-only (framework has no dark mode).
# ════════════════════════════════════════════════════════════════════

[project]
name = "Shop"
out_dir = "generated"
rustio_admin_path = "../.."

# ── Design memory (WHY / WHAT) ──
[design]
brief        = "design/DESIGN_BRIEF.md"
reasoning    = "design/DESIGN_REASONING.md"
architecture = "design/DESIGN_ARCHITECTURE.md"
decisions    = "design/DESIGN_DECISIONS.md"
history      = "design/DESIGN_HISTORY.md"

# ── Navigation grouping (D-008) ──
[navigation]
Catalogue = "Products, Categories"
Customers = "Customers"
Sales     = "Orders, Payments"
_hidden   = "Order items, Cart items, Product images, Address"
_out      = "templates/admin/_sidebar.html"

# ── Product list view (rustio-design view layer, D-001/D-002) ──
# Lead with the product name; fold price + stock into one cell, the stock
# rendered as a badge. `build` freezes generated/views/products.view.json and
# writes the list.html override straight into the served templates dir (like
# _sidebar above). Edit, then `rustio-design build`.
[views.products]
model     = "Product"
source    = "src/product.rs"
mode      = "list"
primary   = "name"
secondary = "price + in_stock (badge)"
hidden    = "id"
_out      = "templates/admin/products/list.html"

# ── Order list view (rustio-design view layer, D-001/D-002) ──
# Lead with the order number; fold the amount + status into one cell, the
# status rendered as a badge; show the customer alongside. Same pipeline as
# the product view above — edit, then `rustio-design build`.
[views.orders]
model     = "Order"
source    = "src/order.rs"
mode      = "list"
primary   = "id"
secondary = "total + status (badge), customer_id"
_out      = "templates/admin/orders/list.html"

# ── Customer list view (rustio-design view layer, D-001/D-002) ──
# Lead with the customer name; fold the contact details (email + phone) into one
# inline cell beneath it — the classic "name on top, contact alongside" shape.
# Same pipeline as the views above — edit, then `rustio-design build`.
[views.customers]
model     = "Customer"
source    = "src/customer.rs"
mode      = "list"
primary   = "full_name"
secondary = "email + phone (inline)"
hidden    = "id"
_out      = "templates/admin/customers/list.html"

# ── RustIO Patina palette (D-010) — one accent, warm-stone neutrals, light.
#    Token values mapped from rustio-design-system/tokens/colors.css. ──
[colors]
accent          = "#0E6B5B"   # Patina (rust/verdigris) — the one accent
accent-hover    = "#0B5849"
accent-rgb      = "14 107 91"
accent-soft     = "#e8f0ee"   # patina tint on warm paper
accent-border   = "#bcd8d1"

brand-light     = "#0E6B5B"
brand-dark      = "#0E6B5B"
brand-adaptive  = "#0E6B5B"
brand-surface   = "#0E6B5B"
brand-accent    = "#0E6B5B"
brand-secondary = "#0B5849"
brand-hover     = "#0B5849"
brand-active    = "#084A3D"
brand-tint      = "#e8f0ee"
brand-text      = "#0E6B5B"

# Surfaces — warm paper, light chrome (sidebar/topbar now light, not navy)
surface-chrome  = "#ffffff"
bg              = "#faf9f6"
surface         = "#ffffff"
surface-2       = "#f4f2ee"   # raised / hover
surface-3       = "#eeebe4"   # sunken / active
surface-elevated = "#ffffff"

# Text — warm-stone ink
text-strong     = "#1c1a16"
text            = "#46423b"
text-muted      = "#6c675e"
text-subtle     = "#928c81"

# Lines — warm hairlines
border          = "#e7e3db"
border-soft     = "#efede7"
border-strong   = "#d6d1c7"

# Status — desaturated, warm-leaning (never a rainbow)
success         = "#3f7d54"
warning         = "#946417"
danger          = "#ae382c"
success-bg      = "#eef4ef"
warning-bg      = "#f6f0e6"
danger-bg       = "#f6e9e7"
info-bg         = "#e8f0ee"

# ── Radius — RustIO scale sm 6 · md 9 · lg 12 (supersedes the 7/5/9 sharpen). ──
[radius]
default = "9px"
sm      = "6px"
lg      = "12px"

# ── Type — adopt the RustIO families (Hanken body / JetBrains mono). Sizes are
#    kept ≥16px for accessibility (D-004) rather than the system's 14px product
#    base. Webfonts are NOT fetched (doctrine) — system fallbacks apply until
#    self-hosted faces are added. ──
[typography]
font-sans  = "'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif"
font-mono  = "'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"
fs-xs      = "0.875rem"
fs-sm      = "1rem"
fs-md      = "1.0625rem"
fs-base    = "1.0625rem"
fs-lg      = "1.25rem"
fs-xl      = "1.5rem"
fs-h3      = "1.25rem"
fs-h2      = "1.5rem"
fs-h1      = "2rem"
fs-display = "2rem"

# ── Light warm-stone chrome + status colours + one-accent fold (D-010).
#    The framework's default chrome assumes a DARK surface with light text; we
#    make it light, so re-assert dark warm-stone text in the chrome scope. ──
[custom_css]
rules = """
/* Chrome remap removed (2026-06-29). The old `.rio-sidebar`/`.rio-footer`/
   `.rio-topbar*`/`.rio-sidebar-toggle`/`.rio-search-trigger*` overrides re-themed
   the framework's pre-rail chrome to light warm-stone. The framework has since
   migrated to the dark `.rio-rail` command rail + `.rio-ws*` workspace header,
   so those selectors matched nothing and were dead. The Patina palette still
   ships via the token `:root` block above; the rail is intentionally dark in
   both themes. Re-add a chrome remap targeting `.rio-rail`/`.rio-ws*` only if a
   light rail is wanted. See design/DESIGN_HISTORY.md (2026-06-29). */

/* One accent only ("no second hue, ever"): fold the old amber accent2 into the
   Patina family so dashboard/list usages stay on-brand. */
:root {
  --rio-accent2:      #0e6b5b;
  --rio-accent2-ink:  #0b5849;
  --rio-accent2-soft: #e8f0ee;
  --rio-accent2-rgb:  14 107 91;
}

/* Western lining + tabular figures globally (numbers align in tables). */
:root { font-variant-numeric: tabular-nums lining-nums; }

/* Status colour-coding for orders & payments (D-009), on the system's
   desaturated success/warn/danger. Cell-level via the text-cell title attr. */
td.rio-td--text[title="paid"],
td.rio-td--text[title="completed"] { color: var(--rio-success); font-weight: 600; }
td.rio-td--text[title="shipped"]   { color: var(--rio-accent);  font-weight: 600; }
td.rio-td--text[title="pending"]   { color: var(--rio-warning); font-weight: 600; }
td.rio-td--text[title="failed"]    { color: var(--rio-danger);  font-weight: 600; }
td.rio-td--text[title="cancelled"],
td.rio-td--text[title="refunded"]  { color: var(--rio-text-muted); }
"""
