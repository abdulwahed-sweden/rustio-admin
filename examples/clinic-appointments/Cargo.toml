[package]
name = "clinic-appointments"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "clinic-appointments"
path = "src/main.rs"

[dependencies]
rustio-admin.workspace = true
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Bulk actions on Appointment run raw SQL through the framework's Db
# pool (`db.pool()` returns a sqlx::PgPool). Matches the version +
# feature set the rustio-admin-cli scaffold template ships.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
# Real SMTP transport for the recovery flow. `rustls-tls` keeps the
# build pure-Rust (no OpenSSL system dep); the `smtp-transport` +
# `builder` features are the standard combo for `SmtpTransport` +
# `Message::builder`. `tokio1` runtime to match the rest of the app.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
# Visible runtime logs during the recovery flow (SMTP handshake,
# token issuance, audit emissions). Without a logger initialised
# every `log::info!` call inside the framework is silent.
log = "0.4"
env_logger = "0.11"
# Auto-load `.env` so the operator doesn't have to remember
# `set -a; source .env; set +a`. The example crate is the right
# place for this — the framework itself stays env-agnostic.
dotenvy = "0.15"
