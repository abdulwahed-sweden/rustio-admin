name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: forbid Tier 2 symbols
        run: |
          set -eu
          # The guard scans code, not documentation. Asset dirs
          # (e.g. crates/rustio-admin/assets/docs/) bundle the
          # canonical workspace docs which legitimately *mention*
          # these symbols in passages explaining the guard itself
          # — excluding `crates/*/assets/` keeps the guard
          # focused on Rust source / TOML / templates.
          forbidden='HasSchema|ModelSchema|RustType|SchemaOps|from_schema|contract_validator|contract_doctor|RustioModel'
          if git grep -nE "($forbidden)" \
              -- 'crates/' 'examples/' 'Cargo.toml' ':(exclude,glob)crates/*/assets/**'; then
            echo "::error::Forbidden Tier 2 symbol detected. Tier 1 must not reference Tier 2 metadata."
            exit 1
          fi

      # Builder doctrine grep proofs. Each enforces a numbered
      # invariant from DESIGN_BUILDER.md §10. A failure here is a
      # doctrine violation, not a code-quality issue — fix the
      # underlying pattern, not the grep.
      - name: builder Doctrine B10 — Framework never reads generator metadata
        run: |
          set -eu
          # The Framework crate must not parse the `@generated by rustio`
          # header or its SPDX markers. Code-only matches; doc comments
          # in CLI grep-proof tests are excluded by the path filter.
          if git grep -nE '@generated by rustio|SPDX-SchemaHash|SPDX-EmitterVersion' \
              -- 'crates/rustio-admin/src/'; then
            echo "::error::DESIGN_BUILDER.md §10.2 / Doctrine B10 violation: the Framework crate must not reference Builder header markers."
            exit 1
          fi

      - name: builder Doctrine B3 — single writer for history.jsonl
        run: |
          set -eu
          # Same-line grep: a line constructs a write handle AND
          # references `history.jsonl`. Doc-comment lines (//) are
          # excluded. Only files outside builder/history.rs count
          # as offenders. The in-crate test
          # `builder::history::tests::no_other_writer_to_history_jsonl_in_cli_crate`
          # implements the same check at unit-test time.
          offenders=$(
            git grep -nE '(OpenOptions[^/]*\.(append\(true\)|write\(true\))|File::create).*history\.jsonl' \
              -- 'crates/rustio-admin-cli/src/' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
              | grep -v 'crates/rustio-admin-cli/src/builder/history.rs:' \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "::error::DESIGN_BUILDER.md §10.1 / Doctrine B3 violation: only builder/history.rs may construct write handles to history.jsonl. Offenders:"
            echo "$offenders"
            exit 1
          fi

      - name: builder Doctrine B1 — sole TOML emitter
        run: |
          set -eu
          # Match `toml::to_string` / `toml_edit::*::to_string` only
          # on code lines (skip doc/line comments). Allowed file is
          # builder/toml_canon.rs.
          offenders=$(
            git grep -nE 'toml::to_string|toml_edit::[A-Za-z]*::to_string' \
              -- 'crates/rustio-admin-cli/src/' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
              | grep -v 'crates/rustio-admin-cli/src/builder/toml_canon.rs:' \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "::error::DESIGN_BUILDER.md §10.4 / Doctrine B1 violation: only builder/toml_canon.rs may emit TOML. Offenders:"
            echo "$offenders"
            exit 1
          fi

      - name: builder Doctrine B4 — sole Builder redactor
        run: |
          set -eu
          # Doctrine B4 binds the *Builder's* event-log redactor.
          # Pre-existing domain-specific redactors elsewhere in the
          # CLI (emergency_ui::redact_reason_in_argv,
          # main::redact_password) are out of scope for B4 — they
          # are not on the history.jsonl emission path. The grep is
          # scoped to `crates/rustio-admin-cli/src/builder/`.
          offenders=$(
            git grep -nE '^\s*(pub\s*(\([^)]+\))?\s+)?fn\s+redact' \
              -- 'crates/rustio-admin-cli/src/builder/' \
              | grep -v 'crates/rustio-admin-cli/src/builder/redact.rs:' \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "::error::DESIGN_BUILDER.md §10.5 / Doctrine B4 violation: only builder/redact.rs may define a redactor inside the Builder. Offenders:"
            echo "$offenders"
            exit 1
          fi

      - name: builder §5.6 — no Builder access to src/app/
        run: |
          set -eu
          # Look only at code lines containing the literal "src/app/"
          # as a path. Doc comments (`//!`, `///`, `//`) are
          # excluded.
          offenders=$(
            git grep -nE '"src/app/' -- 'crates/rustio-admin-cli/src/builder/' \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "::error::DESIGN_BUILDER.md §5.6 violation: the Builder may not construct paths under src/app/. Offenders:"
            echo "$offenders"
            exit 1
          fi

      - name: scaffold template pin tracks workspace minor
        run: |
          set -eu
          # The bundled `rustio-admin startproject` template
          # (crates/rustio-admin-cli/templates/project/Cargo.toml.tmpl)
          # must pin the same `rustio-admin` version the workspace
          # ships. Three releases (0.17.0, 0.17.1, 0.18.0) drifted
          # silently — every fresh scaffold failed to resolve until
          # v0.18.1 patched the template. This guard prevents the
          # recurrence.
          workspace=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          template=$(grep -E '^rustio-admin\s*=\s*"' \
            crates/rustio-admin-cli/templates/project/Cargo.toml.tmpl \
            | head -1 | cut -d'"' -f2)
          if [ -z "$workspace" ] || [ -z "$template" ]; then
            echo "::error::scaffold-template-pin guard could not extract both values (workspace='$workspace', template='$template'). Fix the regex or the file format."
            exit 1
          fi
          if [ "$workspace" != "$template" ]; then
            echo "::error::Workspace version ($workspace) and scaffold template pin ($template) have drifted. Update crates/rustio-admin-cli/templates/project/Cargo.toml.tmpl to read 'rustio-admin = \"$workspace\"'. See v0.18.1 release notes for the convention."
            exit 1
          fi
          echo "OK: workspace and scaffold template both pin $workspace"

  reference-example:
    name: reference example (clinic-admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/clinic-admin

      # `examples/clinic-admin` is the canonical reference project. It is
      # its own workspace and pins the published `rustio-admin`, but here
      # we build it against the framework at HEAD (via `[patch.crates-io]`)
      # so a breaking change to the public API trips THIS job — that's the
      # whole point. If a framework *minor* bump makes the pin mismatch the
      # patch, re-pin examples/clinic-admin to the new version as part of
      # the release (same convention as the scaffold-template pin).
      - name: fmt + clippy + build (against framework HEAD)
        working-directory: examples/clinic-admin
        run: |
          set -eu
          cargo fmt --all --check
          printf '\n[patch.crates-io]\nrustio-admin = { path = "../../crates/rustio-admin" }\n' >> Cargo.toml
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace
